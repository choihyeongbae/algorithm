<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>울타리 밖으로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 규칙 한 줄 → 카드 12장 → 고정 하단 버튼. 결과는 맨 위에서 펼쳐짐 */
:root {
  --bg: #f3f5fa; --card: #ffffff; --ink: #142039; --muted: #5a6680; --line: #dce2ee;
  --blue: #2450d8; --blue-soft: #e6ecfd; --sun: #ffcf3a; --good: #1a8a5a; --good-soft: #e3f4ec;
  --bad: #d63c3c; --bad-soft: #fde9e9; --fence: #c9d2e4;
  --display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1420; --card: #171e2d; --ink: #e8ecf5; --muted: #9aa6bf; --line: #2a3347;
    --blue: #6f93ff; --blue-soft: #1d2a4d; --sun: #ffd45a; --good: #4cc98f; --good-soft: #14302a;
    --bad: #ff7a7a; --bad-soft: #3a1d22; --fence: #2c3650; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1420; --card: #171e2d; --ink: #e8ecf5; --muted: #9aa6bf; --line: #2a3347;
  --blue: #6f93ff; --blue-soft: #1d2a4d; --sun: #ffd45a; --good: #4cc98f; --good-soft: #14302a;
  --bad: #ff7a7a; --bad-soft: #3a1d22; --fence: #2c3650; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 600px; margin-inline: auto; padding-block: max(20px, env(safe-area-inset-top, 0px)) 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.fence { height: 40px; position: relative;
  background:
    linear-gradient(var(--fence), var(--fence)) 0 10px / 100% 4px no-repeat,
    linear-gradient(var(--fence), var(--fence)) 0 26px / 100% 4px no-repeat,
    repeating-linear-gradient(90deg, var(--fence) 0 7px, transparent 7px 20px) 0 0 / 100% 100% no-repeat;
  -webkit-mask: linear-gradient(90deg, #000 0 38%, transparent 38% 62%, #000 62% 100%);
          mask: linear-gradient(90deg, #000 0 38%, transparent 38% 62%, #000 62% 100%); }

header { padding-block: 16px 4px; }
.kicker { font-size: 13px; font-weight: 700; color: var(--blue); letter-spacing: .06em; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 11vw, 56px); line-height: 1.05; margin: 6px 0 16px; }
h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--sun) 62% 92%, transparent 92%); }

.rule { background: var(--ink); color: var(--bg); border-radius: 16px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; }
.rule .big { font-family: var(--display); font-size: clamp(24px, 6.4vw, 30px); line-height: 1.25; }
.rule .big mark { background: var(--sun); color: #142039; padding: 0 .2em; border-radius: 4px; }
.rule ol { margin: 0; padding-left: 1.25em; font-size: 15px; line-height: 1.6; }
.fact { margin: 14px 2px 18px; font-size: 14.5px; color: var(--muted); }
.fact b { color: var(--blue); }

ol.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item label { display: flex; gap: 14px; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; min-height: 68px; transition: border-color .15s, background .15s; }
.item input { position: absolute; opacity: 0; pointer-events: none; }
.box { flex: none; width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--fence); display: grid; place-items: center; background: var(--card); transition: background .15s, border-color .15s; }
.box svg { width: 17px; height: 17px; opacity: 0; transition: opacity .12s; }
.body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.txt { font-size: 17px; font-weight: 500; line-height: 1.5; }
.item input:checked + label { border-color: var(--blue); background: var(--blue-soft); }
.item input:checked + label .box { background: var(--blue); border-color: var(--blue); }
.item input:checked + label .box svg { opacity: 1; }
.item input:focus-visible + label { outline: 3px solid var(--sun); outline-offset: 2px; }

.why { display: none; font-size: 14.5px; line-height: 1.5; }
.why b { display: inline-block; margin-right: 6px; }
.graded .why { display: block; }
.graded .item label { cursor: default; }
.graded .item.ok input:checked + label { border-color: var(--good); background: var(--card); }
.graded .item.ok input:checked + label .box { background: var(--good); border-color: var(--good); }
.graded .item.ok .why b { color: var(--good); }
.graded .item.trapped input:checked + label { border-color: var(--bad); background: var(--bad-soft); }
.graded .item.trapped input:checked + label .box { background: var(--bad); border-color: var(--bad); }
.graded .item.trapped .why b { color: var(--bad); }
.graded .item.avoided label { border-color: var(--good); border-style: dashed; }
.graded .item.avoided .why b { color: var(--good); }
.graded .item.missed label { border-color: var(--blue); border-style: dashed; }
.graded .item.missed .why b { color: var(--blue); }

.bar { position: sticky; bottom: 0; margin-top: 14px; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 28%); }
.bar-in { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 20px rgba(20,32,57,.08); }
.meter { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.meter .lab { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.meter .lab.over { color: var(--bad); }
.dots { display: flex; gap: 4px; }
.dots i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); transition: background .15s; }
.dots i.on { background: var(--blue); }
.dots.over i.on { background: var(--bad); }

button, .btn { font: inherit; font-weight: 700; font-size: 17px; border: 0; border-radius: 12px; padding: 14px 20px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; white-space: nowrap; }
.primary { background: var(--blue); color: #fff; }
.primary:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
.win-btn { background: var(--sun); color: #142039; font-size: 19px; min-height: 60px; }
button:focus-visible, .btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.result { margin: 18px 0; border-radius: 18px; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; text-align: center; align-items: center; }
.result.win { background: var(--good-soft); border: 2px solid var(--good); }
.result.lose { background: var(--card); border: 2px solid var(--bad); }
.result h2 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 40px); line-height: 1.15; margin: 0; }
.result p { margin: 0; max-width: 30rem; }
.result .btn, .result button { width: 100%; }
.result .hint { font-size: 14px; color: var(--muted); }
.badge { width: 76px; height: 76px; }

footer { margin-top: 20px; font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.6; }

@media (prefers-reduced-motion: no-preference) {
  .result { animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
  .win .badge { animation: pop .6s .1s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(.4) rotate(-12deg); } to { transform: none; } }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="fence" aria-hidden="true"></div>

  <header>
    <div class="kicker">건강한 미디어 생활 캠페인</div>
    <h1>알고리즘의<br><em>울타리 밖으로</em></h1>
    <div class="rule">
      <div class="big">12개 중 <mark>함정 3개</mark>를 빼고<br>건강한 습관 <mark>9개</mark>만 골라요</div>
      <ol>
        <li>건강한 미디어 습관에 체크해요.</li>
        <li>9개를 고르면 결과 확인 버튼이 켜져요.</li>
        <li>함정을 모두 피하면 경품 응모 기회!</li>
      </ol>
    </div>
    <p class="fact">우리 탐구팀 실험에서 같은 주제만 본 계정은 추천 20개 중 <b>16개</b>가 같은 주제였어요. 다른 주제를 일주일 보자 <b>6개</b>로 줄었어요.</p>
  </header>

  <div id="result" hidden></div>

  <form id="quiz" novalidate>
    <ol class="list" id="list"></ol>
    <div class="bar" id="bar">
      <div class="bar-in">
        <div class="meter">
          <span class="lab" id="lab">0 / 9개 골랐어요</span>
          <div class="dots" id="dots" aria-hidden="true"></div>
        </div>
        <button type="submit" class="primary" id="submit" disabled>결과 확인</button>
      </div>
    </div>
  </form>

  <footer>포항여자고등학교 유튜브 추천 알고리즘 탐구팀</footer>
</div>

<script>
/* ===== 설정 ===== */
const FORM_URL = 'https://forms.gle/v6bzoiBTUEcSRgUE9';

/* ===== 문항 (trap: true 가 함정) ===== */
const ITEMS = [
  { text: '추천 영상이 뜨면 "왜 이게 나한테 떴지?" 생각해 본다.',
    why: '추천은 내 시청 기록으로 만들어져요. 이유를 생각하면 알고리즘이 고른 길이 보여요.' },
  { text: '일주일에 한 번은 안 보던 분야 영상을 직접 검색해 본다.',
    why: '우리 실험에서 다른 주제를 일주일 보자 추천이 크게 바뀌었어요.' },
  { text: '관심 없는 추천은 "관심 없음"을 눌러 정리한다.',
    why: '원하지 않는 방향을 알고리즘에 직접 알려주는 방법이에요.' },
  { text: '추천 영상만 봐도 내 취향에 딱 맞으니, 따로 검색할 필요는 없다.',
    why: '추천만 따라가면 보는 범위가 점점 좁아져요. 우리 실험에서 3주 만에 20개 중 16개가 같은 주제가 됐어요.',
    trap: true },
  { text: '같은 뉴스를 여러 채널에서 비교해 본다.',
    why: '한 곳만 보면 그게 전부라고 믿기 쉬워요. 비교하면 사실과 의견이 구분돼요.' },
  { text: '제목이나 썸네일이 자극적이면 한 번 더 의심한다.',
    why: '자극적인 제목은 클릭을 끌려고 만든 경우가 많아요.' },
  { text: '자동재생을 끄고, 다음 영상은 내가 고른다.',
    why: '자동재생을 끄면 다음 영상을 고르는 사람이 내가 돼요.' },
  { text: '내가 믿는 채널 하나만 보면 가짜뉴스에 속을 일이 없다.',
    why: '한 곳의 생각만 들으면 그것만 맞다고 믿게 돼요. 확증편향을 키우는 습관이에요.',
    trap: true },
  { text: '정보를 알려주는 영상은 출처가 있는지 확인한다.',
    why: '출처가 있어야 다시 확인할 수 있어요.' },
  { text: '나와 생각이 다른 댓글도 읽어 본다.',
    why: '다른 의견을 봐야 내 생각이 치우쳤는지 돌아볼 수 있어요.' },
  { text: '조회수와 좋아요가 많은 영상은 무조건 사실이다.',
    why: '인기가 많다고 사실은 아니에요. 조회수는 관심을 보여줄 뿐이에요.',
    trap: true },
  { text: '볼 시간을 정해 두고 그 시간만 본다.',
    why: '정해 둔 시간이 있으면 추천에 끌려 계속 보는 일을 막을 수 있어요.' }
];

/* ===== 동작 ===== */
const NEED = ITEMS.filter((x) => !x.trap).length;
const TRAPS = ITEMS.length - NEED;
const list = document.getElementById('list');
const form = document.getElementById('quiz');
const submit = document.getElementById('submit');
const lab = document.getElementById('lab');
const dots = document.getElementById('dots');
const bar = document.getElementById('bar');
const resultEl = document.getElementById('result');
const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const render = () => {
  list.replaceChildren();
  ITEMS.forEach((it, i) => {
    const li = document.createElement('li'); li.className = 'item';
    const id = 'q' + (i + 1);
    li.innerHTML = `<input type="checkbox" id="${id}" name="${id}"><label for="${id}"><span class="box">${CHECK}</span><span class="body"><span class="txt"></span><span class="why"><b></b><span class="wt"></span></span></span></label>`;
    li.querySelector('.txt').textContent = it.text;
    li.querySelector('.wt').textContent = it.why;
    list.appendChild(li);
  });
  dots.replaceChildren(...Array.from({ length: NEED }, () => document.createElement('i')));
};

const update = () => {
  const n = form.querySelectorAll('input:checked').length;
  const over = n > NEED;
  lab.textContent = over ? `${n}개 골랐어요 · ${n - NEED}개를 빼 주세요` : `${n} / ${NEED}개 골랐어요`;
  lab.classList.toggle('over', over);
  dots.classList.toggle('over', over);
  [...dots.children].forEach((d, i) => d.classList.toggle('on', i < Math.min(n, NEED)));
  submit.disabled = n !== NEED;
};

const grade = () => {
  let trapped = 0;
  [...list.children].forEach((li, i) => {
    const it = ITEMS[i], input = li.querySelector('input'), on = input.checked, tag = li.querySelector('.why b');
    input.disabled = true;
    if (it.trap && on) { li.classList.add('trapped'); tag.textContent = '함정!'; trapped++; }
    else if (it.trap) { li.classList.add('avoided'); tag.textContent = '함정 피함'; }
    else if (on) { li.classList.add('ok'); tag.textContent = '정답'; }
    else { li.classList.add('missed'); tag.textContent = '건강한 습관'; }
  });
  form.classList.add('graded');
  bar.hidden = true;
  resultEl.hidden = false;

  if (trapped === 0) {
    resultEl.className = 'result win';
    resultEl.innerHTML = `
      <svg class="badge" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="36" fill="var(--sun)"/><path d="M23 39l10 10 20-22" fill="none" stroke="#142039" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h2>완벽해요!<br>함정 ${TRAPS}개를 모두 피했어요</h2>
      <p>그럴듯한 말에 속지 않는 당신은 이미 알고리즘의 울타리 밖으로 나갈 줄 아는 사람이에요.</p>
      <a class="btn win-btn" href="${FORM_URL}" target="_blank" rel="noopener">경품 응모하기</a>
      <p class="hint">아래에서 함정이 왜 함정인지 확인해 보세요.</p>`;
  } else {
    resultEl.className = 'result lose';
    resultEl.innerHTML = `
      <h2>아쉬워요!<br>함정 ${trapped}개에 걸렸어요</h2>
      <p>빨간 칸이 함정이에요. 이유를 읽어 보고 다시 도전해 보세요.</p>
      <button type="button" class="ghost" id="retry">다시 도전하기</button>`;
    document.getElementById('retry').addEventListener('click', reset);
  }
  resultEl.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
};

const reset = () => {
  resultEl.hidden = true; resultEl.replaceChildren();
  form.classList.remove('graded');
  bar.hidden = false;
  render(); update();
  window.scrollTo({ top: 0, behavior: 'auto' });
};

form.addEventListener('change', update);
form.addEventListener('submit', (e) => { e.preventDefault(); if (!submit.disabled) grade(); });
render(); update();
</script>
</body>
</html>
